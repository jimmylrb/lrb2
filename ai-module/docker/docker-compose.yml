# 一键启动：docker compose -f docker/docker-compose.yml up -d
services:
  erbaiav-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8765:8765"
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8765
      # 远程大模型（Qwen 等，OpenAI 兼容）：
      # AI_REMOTE_BASE: https://dashscope.aliyuncs.com/compatible-mode/v1
      # AI_REMOTE_KEY: sk-xxxx
      # AI_REMOTE_MODEL: qwen-plus
    restart: unless-stopped
